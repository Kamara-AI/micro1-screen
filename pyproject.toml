[tool.poetry]
name = "micro1-screen"
version = "0.1.0"
description = "SCREEN — Structured Candidate Reasoning and Evaluation Engine"
authors = ["Brian Kamara <kamarabrian35@gmail.com>"]
readme = "README.md"
packages = [{include = "screen"}]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^0.2"
langchain = "^0.3"
langchain-google-genai = "^2.0"
langchain-openai = "^0.2"
langchain-core = "^0.3"
pydantic = "^2.0"
pydantic-settings = "^2.0"
python-dotenv = "^1.0"
structlog = "^24.0"
tenacity = "^8.0"
google-generativeai = "^0.8"
httpx = "^0.27"
rich = "^13.0"
pytz = "^2024.0"
tavily-python = "^0.3"
beautifulsoup4 = "^4.12"
PyGithub = "^2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-env = "^1.0"
black = "^24.0"
ruff = "^0.6"
mypy = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=screen --cov-report=term-missing"
env = [
    "GEMINI_API_KEY=test-key-placeholder",
    "ENV=test",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
